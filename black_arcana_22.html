<body><main><section class="shell">
<header><div class="brand">☽ THE BLACK ARCANA ☾</div><h1 class="title">آرکانای سیاه</h1><div class="sub">۲۲ آرکانای بزرگ · آزمون شخصیت گاثیک<br>ده پرسش برای عبور از پرده‌ی سایه‌ها و دیدن کارت درونی تو.</div></header>
<div id="quiz"><div class="divider">پرده‌ی نخست · ده نشانه</div><div class="progress"><span id="bar"></span></div><div class="meta"><span id="counter">پرسش ۱ از ۱۰</span><span>به ندای درونت گوش کن</span></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div class="controls"><button class="btn" id="back" disabled>قبلی</button><button class="btn primary" id="forward" disabled>ادامه ✦</button></div><div class="hint">این آزمون برای سرگرمی و خودشناسی نمادین است، نه تشخیص روان‌شناختی یا پیش‌گویی.</div></div>

<script>
const Q=[
["در دل یک شب بی‌ماه، کجا می‌روی؟",["به دنبال صدای مرموز جنگل","به برج خاموشی برای فکر کردن","به جشن عجیب و ناشناخته","به جایی که بتوانم سرنوشت را عوض کنم"]],
["وقتی حقیقت تلخی آشکار می‌شود…",["به شهودم اعتماد می‌کنم","در سکوت معنایش را می‌سنجم","امید را از دست نمی‌دهم","هرچه دروغین است فرو می‌ریزم"]],
["کدام شیء را از دخمه‌ای باستانی برمی‌داری؟",["آینه‌ای مه‌آلود","فانوسی فرسوده","ستاره‌ای نقره‌ای","کلیدی برای دروازه‌ی ممنوع"]],
["دیگران تو را بیشتر چگونه می‌بینند؟",["مرموز و حساس","عمیق و مستقل","گرم و الهام‌بخش","قوی و دگرگون‌کننده"]],
["قدرت جادویی دلخواهت چیست؟",["دیدن رؤیاها و نشانه‌ها","دانستن رازهای جهان","شفا دادن روح‌ها","آفرینش واقعیت با اراده"]],
["در رابطه با گذشته…",["هنوز به رازهایش فکر می‌کنم","از آن درس می‌گیرم، تنها","با عشق رهایش می‌کنم","پایانش می‌دهم و از نو می‌سازم"]],
["کدام مکان حس آشنایی دارد؟",["دریاچه‌ی مه‌گرفته","کتابخانه‌ی زیرزمینی","باغی زیر نور ستاره","کلیسای ویران در طوفان"]],
["وقتی کسی آسیب‌پذیر است…",["حس ناگفته‌هایش را می‌فهمم","بی‌قضاوت گوش می‌دهم","به او امید و آرامش می‌دهم","از او دفاع می‌کنم"]],
["کدام نماد را روی انگشترت حک می‌کنی؟",["هلال ماه","فانوس","ستاره","صاعقه"]],
["در آستانه‌ی ناشناخته…",["به نشانه‌ها گوش می‌دهم","قدم آهسته و آگاهانه برمی‌دارم","با امید پیش می‌روم","بی‌هراس جهش می‌کنم"]]
];
const A=[
["ماه","XVIII · THE MOON","شهود، رؤیا و راز","تو از جنس مه و نیمه‌روشنایی هستی. تخیل غنی و حساسیتت باعث می‌شود لایه‌هایی را ببینی که از نگاه دیگران پنهان می‌مانند.","شهود، خلاقیت و همدلی عمیق","گاهی ترس یا خیال می‌تواند جای واقعیت را بگیرد؛ شهود را با شواهد همراه کن.","احساساتت را بنویس و به خودت فرصت بده تا میان ترس و دریافت درونی فرق بگذاری.","ماه، دو برج، آب و راهی در مه"],
["گوشه‌نشین","IX · THE HERMIT","خرد، خلوت و جست‌وجوی حقیقت","تو چراغ خودت را در تاریکی حمل می‌کنی. خلوت برایت فرصتی برای فهمیدن است؛ پاسخ‌های آماده قانعت نمی‌کنند و ترجیح می‌دهی حقیقت را با تجربه کشف کنی.","استقلال، تمرکز و بینش","ممکن است بیش از حد از دیگران فاصله بگیری و همه‌چیز را تنهایی به دوش بکشی.","چراغت را گاهی با دیگران شریک شو؛ صمیمیت از عمق تو کم نمی‌کند.","فانوس، عصا و قله‌ی سرد"],
["ستاره","XVII · THE STAR","امید، ترمیم و الهام","در تو نوری آرام برای بازسازی وجود دارد. حتی پس از روزهای سخت، می‌توانی امکان تازه‌ای ببینی و به اطرافیانت امید ببخشی.","مهربانی، امید و الهام‌بخشی","گاهی خوش‌بینی باعث می‌شود نیازهای خودت یا محدودیت‌های واقعی را نادیده بگیری.","امیدت را با قدم‌های کوچک و واقعی همراه کن؛ تو نیز سزاوار مراقبتی.","ستاره‌ی هشت‌پر، آب و آسمان شب"],
["برج","XVI · THE TOWER","دگرگونی، حقیقت و رهایی","تو ساختارهای پوسیده را به چالش می‌کشی. حقیقت را به آرامش مصنوعی ترجیح می‌دهی و قدرتت در بازسازی پس از فروپاشی است. برج نماد تغییر است، نه بداقبالی.","شجاعت، صداقت و انعطاف در بحران","ممکن است از روی خشم یا بی‌صبری چیزی را زودتر از موعد خراب کنی.","قبل از شکستن دیوار، مسیر عبور را بساز؛ تغییر آگاهانه ماندگارتر است.","برج سنگی، صاعقه و شعله"],
["کاهنه‌ی اعظم","II · THE HIGH PRIESTESS","راز، سکوت و دانایی درونی","تو نگهبان جهان‌های پنهانی. مشاهده‌گر، آرام و شهودی هستی و لازم نمی‌بینی هرچه می‌دانی آشکار کنی.","صبر، شهود و مرزبندی سالم","سکوت طولانی ممکن است دیگران را از فهمیدن نیازهایت محروم کند.","در رابطه‌ی امن، بخشی از جهان درونی‌ات را به اشتراک بگذار.","پرده، ستون‌های دوگانه و هلال ماه"],
["مرگ","XIII · DEATH","پایان، پوست‌اندازی و تولد دوباره","این کارت نماد مرگ فیزیکی نیست؛ نشانه‌ی پایان یک فصل و دگرگونی است. تو توان رها کردن نسخه‌های قدیمی خودت را داری.","رهایی، سازگاری و شروع دوباره","ممکن است احساسات ناشی از پایان را سریع کنار بزنی.","به پایان‌ها فرصت سوگواری بده؛ لازم نیست فوراً به شروع تبدیل شوند.","اسکلت نمادین، گل سفید و دروازه"],
["شیطان","XV · THE DEVIL","میل، کاریزما و مواجهه با سایه","این کارت به معنای شرارت نیست؛ از شناخت میل، جذابیت و زنجیرهایی حرف می‌زند که گاهی خودمان انتخاب می‌کنیم. انرژی تو خام و نافذ است.","جسارت، شور و کاریزما","وابستگی یا افراط ممکن است آزادی‌ات را محدود کند.","از خود بپرس: این خواسته انتخاب من است یا عادتی که مرا در بند کرده؟","شاخ‌ها، زنجیرهای گسستنی و شعله"],
["امپراتریس","III · THE EMPRESS","آفرینش، احساس و فراوانی","تو توان پرورش ایده‌ها و رابطه‌ها را داری. هنر، زیبایی، طبیعت و پیوند عاطفی برایت مهم‌اند؛ محبتت ملموس و زنده است.","خلاقیت، سخاوت و مراقبت","گاهی نیازهای دیگران را بر خودت مقدم می‌کنی.","همان‌قدر که برای دیگران فضا می‌سازی، برای خودت نیز جا نگه دار.","تاج، گل‌های تیره و هلال ماه"],
["جادوگر","I · THE MAGICIAN","اراده، مهارت و آفرینش","تو ایده را به عمل تبدیل می‌کنی. ابتکار و توان استفاده از منابع موجود به تو کمک می‌کند از هیچ، چیزی بسازی.","مهارت، اعتمادبه‌نفس و ابتکار","ممکن است بخواهی همه‌چیز را کنترل کنی یا انرژی‌ات را پراکنده کنی.","یک هدف را انتخاب کن و انرژی‌ات را روی اجرای آن متمرکز کن.","عصا، جام، شمشیر و سکه"],
["ابله / رهرو","0 · THE FOOL","آزادی، آغاز و کنجکاوی","روحی آزاد و آماده‌ی تجربه داری. زندگی را می‌خواهی لمس کنی، نه فقط درباره‌اش فکر کنی؛ مسیرهای تازه تو را زنده می‌کنند.","کنجکاوی، انعطاف و شجاعت آغاز","بی‌برنامگی ممکن است تو را به دردسر بیندازد.","سبکی و آزادی‌ات را حفظ کن، اما پیش از جهش نگاهی به زمین زیر پایت بینداز.","کوله، پرتگاه و گل سفید"],
["قدرت","VIII · STRENGTH","شجاعت آرام و مهار نفس","قدرت تو از سلطه نمی‌آید؛ از توان مهربان ماندن در لحظه‌های دشوار و رام کردن نیروی درونی با صبر می‌آید.","استقامت، شفقت و شجاعت","ممکن است احساساتت را بیش از حد مهار کنی و خستگی را پنهان نگه داری.","قدرت واقعی گاهی یعنی درخواست کمک و نشان دادن آسیب‌پذیری.","شیر، گل و دست‌های آرام"],
["عدالت","XI · JUSTICE","تعادل، مسئولیت و حقیقت","تو به تناسب میان عمل و پیامد اهمیت می‌دهی. تصمیم‌ها را با وجدان و منطق می‌سنجی و از حقیقت فرار نمی‌کنی.","انصاف، وضوح و مسئولیت‌پذیری","گاهی سخت‌گیری یا قضاوت بیش از حد می‌تواند انعطاف را کم کند.","هم عدالت را نگه دار و هم برای پیچیدگی‌های انسانی جا باز کن.","ترازو، شمشیر و پرده‌ی سنگی"],
["ارابه","VII · THE CHARIOT","اراده، حرکت و پیروزی","وقتی مقصدی داشته باشی، نیروهای متضاد درونت را به حرکت درمی‌آوری. تو اهل پیشروی و عبور از موانع هستی.","تمرکز، نظم و عزم","ممکن است مسیر را آن‌قدر سریع طی کنی که احساساتت جا بمانند.","گاهی توقف هم بخشی از حرکت به سوی مقصد است.","ارابه، دو نیروی متضاد و ستاره"],
["عشاق","VI · THE LOVERS","پیوند، انتخاب و ارزش‌ها","تو رابطه و انتخاب را جدی می‌گیری. برایت مهم است که تصمیم‌ها با ارزش‌های قلبی‌ات هماهنگ باشند.","همدلی، صمیمیت و وفاداری به ارزش‌ها","ممکن است برای حفظ پیوند، خودت را فراموش کنی یا در انتخاب مردد بمانی.","عشق سالم، انتخاب خودت را هم در کنار دیگری نگه می‌دارد.","دو پیکر، گل و بال‌های نمادین"],
["چرخ سرنوشت","X · WHEEL OF FORTUNE","چرخه، فرصت و تغییر","تو می‌دانی زندگی در حرکت است. تغییرات را بخشی از چرخه می‌بینی و می‌توانی در لحظه‌های چرخش، فرصت‌های تازه پیدا کنی.","سازگاری، انعطاف و نگاه کلان","ممکن است بیش از حد منتظر شانس بمانی.","وقتی چرخ می‌چرخد، انتخاب‌های کوچک تو همچنان اهمیت دارند.","چرخ، ستاره‌های چهارگانه و نمادهای باستانی"],
["مرد آویخته","XII · THE HANGED MAN","توقف، تسلیم و دید تازه","تو توان دیدن جهان از زاویه‌ای متفاوت را داری. گاهی مکث و رها کردن کنترل، راه فهم تازه‌ای باز می‌کند.","صبر، پذیرش و بینش","ممکن است در انتظار یا فداکاری بیش از حد گیر کنی.","مکث کن، اما فراموش نکن که می‌توانی دوباره حرکت کنی.","پیکر وارونه، هاله و شاخه"],
["اعتدال","XIV · TEMPERANCE","آرامش، ترکیب و هماهنگی","تو از آمیختن تضادها معنا می‌سازی. به جای افراط، به دنبال ریتمی پایدار و راهی میانه می‌گردی.","تعادل، صبر و سازگاری","گاهی برای حفظ آرامش، حقیقت ناراحت‌کننده را عقب می‌اندازی.","تعادل به معنی حذف اختلاف نیست؛ گاهی گفت‌وگوی صادقانه لازم است.","دو جام، آب روان و بال‌ها"],
["جهان","XXI · THE WORLD","کمال، یکپارچگی و پایان چرخه","تو به دنبال معنا و تصویر کامل هستی. تجربه‌های گوناگون را کنار هم می‌گذاری و از پایان یک مسیر، حس رشد و تمامیت می‌گیری.","دید گسترده، تکمیل و یکپارچگی","ممکن است پایان بی‌نقص بخواهی و شروع تازه را عقب بیندازی.","به خودت اجازه بده فصل را با نقص‌هایش ببندی.","حلقه‌ی برگ، چهار نگهبان و رقص"],
["خورشید","XIX · THE SUN","زندگی، وضوح و شادی","در تو گرمایی روشن وجود دارد. صداقت و شور زندگی‌ات می‌تواند فضا را روشن کند و ابهام را کنار بزند.","وضوح، سرزندگی و اعتماد","ممکن است همیشه بخواهی مثبت بمانی و غم را پنهان کنی.","هم نور و هم سایه بخشی از تو هستند؛ لازم نیست همیشه درخشان باشی.","خورشید، گل و اسب سفید"],
["داوری","XX · JUDGEMENT","بیداری، بازنگری و فراخوان","تو به لحظه‌های بیداری و بازنگری اهمیت می‌دهی. گذشته را می‌سنجی تا صدای عمیق‌تر خودت را بشنوی و به مرحله‌ای تازه پاسخ بدهی.","خودآگاهی، صداقت و رشد","ممکن است خودت را با گذشته بیش از حد محکوم کنی.","از گذشته درس بگیر، نه اینکه تا ابد در دادگاه آن زندگی کنی.","شیپور، پیکرهای برخاسته و آسمان"],
